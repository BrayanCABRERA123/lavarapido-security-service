spring:
  # respuestas de error sin mensajes internos ni trazas (en Spring Boot 4 reemplaza a server.error.*)
  web:
    error:
      include-message: never
      include-stacktrace: never
  application:
    name: security-service
  # E-05 (H-06): sin perfil por defecto. En local se activa dev a mano (SPRING_PROFILES_ACTIVE=dev, como
  # hace docker-compose.yml); así un despliegue que olvide la variable no arranca con Swagger ni cuentas demo.
  # Los secretos locales viven en lavarapido-infra/.env (no se sube), compartido con docker compose.
  # Un .env propio en la carpeta del servicio tiene prioridad. Las variables de entorno reales
  # siempre ganan sobre estos archivos.
  config:
    import:
      - optional:file:../lavarapido-infra/.env[.properties]
      - optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=LavaRapido;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # el esquema lo maneja Liquibase; Hibernate solo valida que el mapeo coincida
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        use_nationalized_character_data: true

  # RabbitMQ (ADR-004): solo se conecta si MESSAGING_ENABLED=true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  # SMTP para el código de recuperación. Solo se usa si app.mail.enabled=true (MAIL_ENABLED).
  # Gmail: smtp.gmail.com:587 + contraseña de aplicación. Mailpit (dev): localhost:1025.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    # Una tabla de changelog por servicio: los seis servicios migran la misma base de datos.
    database-change-log-table: DATABASECHANGELOG_SECURITY
    database-change-log-lock-table: DATABASECHANGELOGLOCK_SECURITY

server:
  port: ${PORT:3001}
  shutdown: graceful

security:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:lavarapido-security-service}
    audience: ${JWT_AUDIENCE:lavarapido-api}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:1h}
  password:
    bcrypt-strength: 12
  password-recovery:
    code-ttl: 15m
    max-failed-attempts: 5

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8081}
  messaging:
    # false: los eventos solo van al log. true: se publican en RabbitMQ (ADR-004)
    enabled: ${MESSAGING_ENABLED:false}
  mail:
    # false: el código sale en el log (dev). true: se envía por correo al usuario.
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:LavaRápido <no-reply@lavarapido.local>}
  internal:
    # llave que comparten los servicios para /internal/** (X-Internal-Key). Vacía: rutas cerradas
    api-key: ${INTERNAL_API_KEY:}
  # primer administrador de una instalación nueva (producción). Solo se usa si no hay ningún
  # administrador; vacío: no se crea nada (en desarrollo lo crea DevDataSeeder)
  # SOLO perfil dev (DevDataSeeder): contraseñas de las cuentas demo; vacía = esa cuenta no se crea
  demo:
    admin-password: ${DEMO_ADMIN_PASSWORD:}
    operator-password: ${DEMO_OPERATOR_PASSWORD:}
    client-password: ${DEMO_CLIENT_PASSWORD:}
  bootstrap-admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    first-name: ${ADMIN_FIRST_NAME:}
    last-name: ${ADMIN_LAST_NAME:}
    document-number: ${ADMIN_DOCUMENT:}
    phone: ${ADMIN_PHONE:}

# Swagger apagado por defecto; application-dev.yml lo prende para desarrollo.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  # Un SMTP caído no debe marcar el servicio como caído: el correo es secundario al login.
  health:
    mail:
      enabled: false
    # sin mensajería encendida, RabbitMQ no se revisa
    rabbit:
      enabled: ${MESSAGING_ENABLED:false}
  info:
    env:
      enabled: true

info:
  service: security-service

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
